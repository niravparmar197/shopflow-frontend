# ShopFlow web (dist-web/). Same cache rules as scripts/serve.mjs:
#   hashed files (assets/*)                       → 1 year, immutable
#   index.html, remoteEntry.js, the manifests     → no-cache (always revalidate),
#     so a browser never mixes an old remoteEntry.js with new chunks
#   unknown app routes (/orders/123)              → index.html (SPA)
#   Cache-Control only on 200/3xx (no "always"): a 404 must never be cached.
# HTTPS and compression are Caddy's job (it is in front on Stage 1).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css application/javascript application/json;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location ~ (^|/)(remoteEntry\.js|mf-manifest\.json|mfe-manifest\.json)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other file (favicon...): short cache. A missing file is a real 404,
    # not index.html (a missing chunk must fail loudly, not load HTML as JS).
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
